trigger: none

pool:
  name: 'Softland-QA'

steps:

- powershell: |

    # ============================================================
    # Cargar librería para usar SendKeys
    # ============================================================

    Add-Type -AssemblyName System.Windows.Forms


    # ============================================================
    # Buscar el archivo .exe dentro de C:\Release
    # ============================================================

    $archivoExe = Get-ChildItem `
        -Path "C:\Release" `
        -Filter "*.exe" |
        Select-Object -First 1


    if (-not $archivoExe) {

        Write-Host "No se encontró ningún archivo .exe en C:\Release"

        exit 1
    }


    # ============================================================
    # Ejecutar el instalador
    # ============================================================

    Start-Process -FilePath $archivoExe.FullName

    Write-Host "Instalador iniciado: $($archivoExe.FullName)"


    # ============================================================
    # Esperar a que la ventana del instalador se abra
    # ============================================================

    Start-Sleep -Seconds 5


    # ============================================================
    # Enviar Enter para avanzar
    # ============================================================

    Write-Host "Paso 1 - ENTER"

    [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")


    # ============================================================
    # Esperar que la ventana esté activa
    # ============================================================

    Start-Sleep -Seconds 5


    # ============================================================
    # Primer checkbox
    # TAB + ESPACIO
    # ============================================================

    Write-Host "Paso 2 - Primer checkbox"

    [System.Windows.Forms.SendKeys]::SendWait("{TAB}")

    [System.Windows.Forms.SendKeys]::SendWait(" ")


    # ============================================================
    # Confirmar
    # ============================================================

    Start-Sleep -Seconds 1

    Write-Host "Paso 3 - Confirmar primer checkbox"

    [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")


    # ============================================================
    # Segundo checkbox
    # TAB + ESPACIO
    # ============================================================

    Start-Sleep -Seconds 5

    Write-Host "Paso 4 - Segundo checkbox"

    [System.Windows.Forms.SendKeys]::SendWait("{TAB}")

    [System.Windows.Forms.SendKeys]::SendWait(" ")


    # ============================================================
    # Confirmar nuevamente
    # ============================================================

    Start-Sleep -Seconds 1

    Write-Host "Paso 5 - Confirmar segundo checkbox"

    [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")


    # ============================================================
    # Paso siguiente
    # ============================================================

    Start-Sleep -Seconds 1

    Write-Host "Paso 6 - Continuar instalación"

    [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")


    # ============================================================
    # Esperar que la instalación trabaje
    # ============================================================

    Write-Host "Instalación trabajando..."

    Start-Sleep -Seconds 20


    # ============================================================
    # Simular autenticación con contraseña
    #
    # Esperar que se abra la ventana final
    # 1300 segundos
    # ============================================================

    Write-Host "Esperando ventana de autenticación..."

    Start-Sleep -Seconds 1300


    # ============================================================
    # Presionar Enter para activar
    # ============================================================

    Write-Host "Paso 7 - Activar ventana"

    [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")


    # ============================================================
    # Esperar que se active el campo de texto
    # ============================================================

    Start-Sleep -Seconds 5


    # ============================================================
    # Validar contraseña
    # ============================================================

    if ([string]::IsNullOrWhiteSpace($env:SETUP_PASSWORD)) {

        Write-Error "No está definida la variable SetupPassword."

        exit 1
    }


    # ============================================================
    # Escribir contraseña
    # ============================================================

    Write-Host "Paso 8 - Ingresando contraseña"

    [System.Windows.Forms.SendKeys]::SendWait(
        $env:SETUP_PASSWORD
    )


    # ============================================================
    # Enviar Enter para confirmar
    # ============================================================

    Write-Host "Paso 9 - Confirmar contraseña"

    [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")


    # ============================================================
    # Esperar un poco por seguridad
    # ============================================================

    Start-Sleep -Seconds 10


    # ============================================================
    # Confirmaciones finales
    # ============================================================

    Write-Host "Paso 10 - Confirmación final 1"

    [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")


    Start-Sleep -Seconds 1


    Write-Host "Paso 11 - Confirmación final 2"

    [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")


    # ============================================================
    # Finalización
    # ============================================================

    Write-Host ""
    Write-Host "=============================================="
    Write-Host "Automatización del instalador completada."
    Write-Host "=============================================="

  env:
    SETUP_PASSWORD: $(SetupPassword)

  displayName: 'Ejecutar Setup Softland'