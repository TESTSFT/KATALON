trigger: none

pool:
  name: 'Softland-QA'

steps:

- powershell: |

    Write-Host "=================================================="
    Write-Host "COPIA DE SETUPS SAR / OFISIS"
    Write-Host "=================================================="
    Write-Host "Equipo: $env:COMPUTERNAME"
    Write-Host "Usuario: $env:USERNAME"
    Write-Host ""


    # ============================================================
    # RUTA DE ORIGEN
    # ============================================================

    $origen = "\\apollo\TES\Actualizacion_release"


   
    # ============================================================
    # SERVIDORES DESTINO SAR 5.0
    # ============================================================

    $destinos500 = @(
        "\\SARDT4001\Release",
        "\\SARDT4000\Release",
        "\\SARTES502022\Release",
        "\\SARTES042022\Release"
    )


    # ============================================================
   
    # ============================================================
    # DESTINO OFISIS 5.0
    # ============================================================

    $destinofi500 = @(
        "\\OFISIS502022\Release"
    )


    # ============================================================
    # VALIDAR EXISTENCIA DEL ORIGEN
    # ============================================================

    Write-Host "Validando ruta de origen:"
    Write-Host $origen
    Write-Host ""

    if (-not (Test-Path $origen)) {

        Write-Error "La ruta de origen $origen no existe o no se puede acceder."

        exit 1
    }

    Write-Host "OK - Ruta de origen accesible."
    Write-Host ""


    # ============================================================
    # OBTENER ARCHIVOS SETUPSAR
    # ============================================================

    Write-Host "Buscando archivos setupSAR_*..."

    $setups1 = @(
        Get-ChildItem `
            -Path $origen `
            -Filter "setupSAR_*" `
            -File
    )

    if ($setups1.Count -eq 0) {

        Write-Error "No se encontraron archivos setupSAR_* en $origen."

        exit 1
    }

    Write-Host "Setups SAR encontrados: $($setups1.Count)"

    foreach ($archivo in $setups1) {

        Write-Host " - $($archivo.Name)"
    }

    Write-Host ""


    # ============================================================
    # OBTENER ARCHIVOS SETUPOFISIS
    # ============================================================

    Write-Host "Buscando archivos setupOFISIS_*..."

    $setups2 = @(
        Get-ChildItem `
            -Path $origen `
            -Filter "setupOFISIS_*" `
            -File
    )

    if ($setups2.Count -eq 0) {

        Write-Error "No se encontraron archivos setupOFISIS_* en $origen."

        exit 1
    }

    Write-Host "Setups OFISIS encontrados: $($setups2.Count)"

    foreach ($archivo in $setups2) {

        Write-Host " - $($archivo.Name)"
    }

    Write-Host ""


    # ============================================================
    # INICIALIZAR VARIABLES
    # ============================================================

    $setup460    = $null
    $setup500    = $null
    $setupofi460 = $null
    $setupofi500 = $null


    # ============================================================
    # DETECTAR VERSIONES SAR
    # ============================================================

    Write-Host "Detectando versiones SAR..."

    foreach ($archivo in $setups1) {

        $nombre = $archivo.Name

        if ($nombre -like "setupSAR_4.6.0*") {

            $setup460 = $archivo.FullName

            Write-Host "SAR 4.6 detectado:"
            Write-Host $setup460
        }
        elseif ($nombre -like "setupSAR_5.0.0*") {

            $setup500 = $archivo.FullName

            Write-Host "SAR 5.0 detectado:"
            Write-Host $setup500
        }
    }

    Write-Host ""


    # ============================================================
    # DETECTAR VERSIONES OFISIS
    # ============================================================

    Write-Host "Detectando versiones OFISIS..."

    foreach ($archivo in $setups2) {

        $nombre = $archivo.Name

        if ($nombre -like "setupOFISIS_4.6.0*") {

            $setupofi460 = $archivo.FullName

            Write-Host "OFISIS 4.6 detectado:"
            Write-Host $setupofi460
        }
        elseif ($nombre -like "setupOFISIS_5.0.0*") {

            $setupofi500 = $archivo.FullName

            Write-Host "OFISIS 5.0 detectado:"
            Write-Host $setupofi500
        }
    }

    Write-Host ""


    # ============================================================
    # FUNCION PARA LIMPIAR CARPETA
    # ============================================================

    function Limpiar-Carpeta {

        param (
            [string]$ruta
        )

        try {

            Write-Host ""
            Write-Host "Limpiando:"
            Write-Host $ruta

            Get-ChildItem `
                -Path $ruta `
                -Force `
                -ErrorAction Stop |
            Remove-Item `
                -Force `
                -Recurse `
                -ErrorAction Stop

            Write-Host "Carpeta limpiada correctamente."

            return $true
        }
        catch {

            Write-Warning "No se pudo limpiar la carpeta $ruta."

            Write-Warning "Detalles:"
            Write-Warning $_.Exception.Message

            return $false
        }
    }


    # ============================================================
    # FUNCION PARA COPIAR SETUP
    # ============================================================

    function Copiar-Setup {

        param (
            [string]$rutaDestino,
            [string]$archivoSetup
        )

        Write-Host ""
        Write-Host "--------------------------------------------------"
        Write-Host "Procesando destino:"
        Write-Host $rutaDestino
        Write-Host "--------------------------------------------------"


        # Validar destino

        if (-not (Test-Path $rutaDestino)) {

            Write-Warning "No se encontró la ruta destino:"
            Write-Warning $rutaDestino

            return
        }


        # Limpiar carpeta

        $limpiezaOK = Limpiar-Carpeta `
            -ruta $rutaDestino


        if (-not $limpiezaOK) {

            Write-Warning "Se omite la copia porque no se pudo limpiar el destino."

            return
        }


        # Copiar archivo

        try {

            Copy-Item `
                -Path $archivoSetup `
                -Destination $rutaDestino `
                -Force `
                -ErrorAction Stop

            Write-Host "Setup copiado correctamente."
            Write-Host "Origen : $archivoSetup"
            Write-Host "Destino: $rutaDestino"
        }
        catch {

            Write-Warning "No se pudo copiar el setup."

            Write-Warning "Origen:"
            Write-Warning $archivoSetup

            Write-Warning "Destino:"
            Write-Warning $rutaDestino

            Write-Warning "Error:"
            Write-Warning $_.Exception.Message
        }
    }


    # ============================================================
    # PROCESAR DESTINOS SAR 5.0
    # ============================================================

    Write-Host ""
    Write-Host "=================================================="
    Write-Host "PROCESANDO SAR 5.0"
    Write-Host "=================================================="

    if ($setup500) {

        foreach ($ruta in $destinos500) {

            Copiar-Setup `
                -rutaDestino $ruta `
                -archivoSetup $setup500
        }
    }
    else {

        Write-Warning "No se encontró setup SAR 5.0."
    }


 
    # ============================================================
    # PROCESAR DESTINO OFISIS 5.0
    # ============================================================

    Write-Host ""
    Write-Host "=================================================="
    Write-Host "PROCESANDO OFISIS 5.0"
    Write-Host "=================================================="

    if ($setupofi500) {

        foreach ($ruta in $destinofi500) {

            Copiar-Setup `
                -rutaDestino $ruta `
                -archivoSetup $setupofi500
        }
    }
    else {

        Write-Warning "No se encontró setup OFISIS 5.0."
    }


    # ============================================================
    # FINALIZACION
    # ============================================================

    Write-Host ""
    Write-Host "=================================================="
    Write-Host "PROCESO DE COPIA FINALIZADO"
    Write-Host "=================================================="

  displayName: 'Copiar Setups SAR y OFISIS'
