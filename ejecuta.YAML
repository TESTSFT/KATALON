trigger: none

# Ejecuta el pipeline en el agente Self-hosted instalado en tu equipo.
pool:
  name: 'Softland-QA'
  demands:
    - Agent.OS -equals Windows_NT

steps:
- powershell: |
    # ============================================================
    # VALIDACIONES INICIALES
    # ============================================================

    Write-Host "=========================================="
    Write-Host "EJECUCION EN SELF-HOSTED AGENT"
    Write-Host "=========================================="
    Write-Host "Equipo: $env:COMPUTERNAME"
    Write-Host "Usuario: $env:USERNAME"
    Write-Host "Sistema: $env:OS"
    Write-Host ""

    if ($env:OS -ne "Windows_NT") {
        Write-Error "Este script debe ejecutarse en Windows."
        exit 1
    }

    if (-not (Test-Path "C:\Release")) {
        Write-Error "La carpeta C:\Release no existe en el equipo del agente."
        exit 1
    }

    # Cargar librería para usar SendKeys
    Add-Type -AssemblyName System.Windows.Forms

    # WScript.Shell se usa solamente para asegurar que el instalador
    # tenga el foco antes de enviar las teclas.
    $wshell = New-Object -ComObject WScript.Shell

    # ============================================================
    # BUSCAR EL ARCHIVO .EXE DENTRO DE C:\Release
    # ============================================================

    $archivoExe = Get-ChildItem -Path "C:\Release" -Filter "*.exe" -File | Select-Object -First 1

    if (-not $archivoExe) {
        Write-Host "No se encontró ningún archivo .exe en C:\Release"
        exit 1
    }

    Write-Host "Instalador encontrado: $($archivoExe.FullName)"

    # ============================================================
    # EJECUTAR EL INSTALADOR
    # ============================================================

    $instalador = Start-Process -FilePath $archivoExe.FullName -PassThru
    Write-Host "Instalador iniciado: $($archivoExe.FullName)"
    Write-Host "PID inicial: $($instalador.Id)"

    # Esperar a que la ventana del instalador se abra
    Start-Sleep -Seconds 5

    # Intentar dar foco al instalador antes de enviar teclas.
    try {
        $instalador.Refresh()
        [void]$wshell.AppActivate($instalador.Id)
        Start-Sleep -Milliseconds 750
    }
    catch {
        Write-Warning "No se pudo activar la ventana por PID. Se continuará con la secuencia original."
    }

    # Enviar Enter para avanzar
    [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")

    # Esperar que la ventana esté activa
    Start-Sleep -Seconds 5

    # Primer checkbox (Tab + Espacio)
    [System.Windows.Forms.SendKeys]::SendWait("{TAB}")
    [System.Windows.Forms.SendKeys]::SendWait(" ")

    # Confirmar
    Start-Sleep -Seconds 1
    [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")

    # Segundo checkbox (Tab + Espacio)
    Start-Sleep -Seconds 5
    [System.Windows.Forms.SendKeys]::SendWait("{TAB}")
    [System.Windows.Forms.SendKeys]::SendWait(" ")

    # Confirmar nuevamente
    Start-Sleep -Seconds 1
    [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")

    # Paso siguiente
    Start-Sleep -Seconds 1
    [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")

    # Esperar que la instalación trabaje
    Start-Sleep -Seconds 20

    # ============================================================
    # SIMULAR AUTENTICACION CON CONTRASEÑA
    # ============================================================

    # Mantiene el tiempo original: 1500 segundos (~25 minutos)
    Start-Sleep -Seconds 1500

    # Volver a intentar activar la ventana del instalador antes
    # de continuar con la autenticación.
    try {
        $instalador.Refresh()
        [void]$wshell.AppActivate($instalador.Id)
        Start-Sleep -Milliseconds 750
    }
    catch {
        Write-Warning "No se pudo reactivar la ventana por PID. Se continuará con la secuencia original."
    }

    # Presionar Enter para que se active
    [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")

    # Esperar que se active el campo de texto
    Start-Sleep -Seconds 10

    # Validar que la contraseña secreta exista
    if ([string]::IsNullOrWhiteSpace($env:SETUP_PASSWORD)) {
        Write-Error "No está definida la variable secreta SetupPassword en Azure DevOps."
        exit 1
    }

    # Escribir la contraseña
    [System.Windows.Forms.SendKeys]::SendWait($env:SETUP_PASSWORD)

    # Enviar Enter para confirmar
    [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")

    # Esperar un poco por seguridad
    Start-Sleep -Seconds 10

    # Confirmaciones finales con Enter
    [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
    Start-Sleep -Seconds 1
    [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")

    Write-Host "Automatización del instalador completada."

  displayName: 'Ejecutar Setup Softland en equipo QA'
  env:
    SETUP_PASSWORD: $(SetupPassword)
  timeoutInMinutes: 45
